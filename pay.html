<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pagar Dion NFC</title><style>body{background:#f8f8fa;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui;padding:16px}.card{background:#fff;border-radius:24px;padding:24px;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}.logo{width:60px;height:60px;background:#ff6a00;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:30px;margin:0 auto 12px}.btn{background:#ff6a00;color:#fff;border:none;border-radius:12px;padding:14px;width:100%;font-weight:800;margin-top:10px;cursor:pointer}.info{background:#f5f5f7;border-radius:10px;padding:10px;margin:10px 0;font-size:13px;text-align:left}</style></head><body><div class="card"><div class="logo">D</div><h2>PIX</h2><p style="color:#777">Dion NFC</p><div class="info">🏪 <span id="loja">Dion</span><br>💰 <span id="valor">--</span><br>🏷️ <span id="tag">--</span><br><span id="data"></span></div><img id="qr" style="width:220px;border-radius:10px"><button class="btn" onclick="navigator.clipboard.writeText(window._pix);alert('Copiado')">📋 COPIAR PIX</button><p style="font-size:11px;color:#999;margin-top:8px" id="rast"></p></div><script>const p=new URLSearchParams(location.search);const chave=p.get('chave')||'';const nome=p.get('nome')||'DION';const cidade=p.get('cidade')||'TEIXEIRA';const valor=p.get('valor')||'';const tag=p.get('tag')||'CAIXA01';const loja=p.get('loja')||'Dion';document.getElementById('loja').innerText=loja;document.getElementById('tag').innerText=tag;document.getElementById('valor').innerText=valor?'R$ '+valor:'Livre';document.getElementById('data').innerText=new Date().toLocaleString('pt-BR');document.getElementById('rast').innerText=tag+'-'+Date.now().toString().slice(-6);function tlv(id,v){return id+String(v.length).padStart(2,'0')+v}let pay=tlv('00','br.gov.bcb.pix')+tlv('01',chave);let ma=tlv('26',pay);let pix=tlv('00','01')+tlv('01','12')+ma+tlv('52','0000')+tlv('53','986')+(valor?tlv('54',parseFloat(valor).toFixed(2)):'')+tlv('58','BR')+tlv('59',nome.substring(0,25))+tlv('60',cidade.substring(0,15))+tlv('62',tlv('05',tag));let w=pix+'6304';let crc=0xFFFF;for(let i=0;i<w.length;i++){crc^=w.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=crc&0x8000?(crc<<1)^0x1021:crc<<1;crc&=0xFFFF}pix=w+crc.toString(16).toUpperCase().padStart(4,'0');window._pix=pix;document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(pix);let logs=JSON.parse(localStorage.getItem('dion_logs')||'[]');logs.unshift({tag,loja,valor,data:new Date().toISOString()});localStorage.setItem('dion_logs',JSON.stringify(logs));</script></body></html>
