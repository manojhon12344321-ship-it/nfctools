<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagar - Dion NFC</title>
<style>
body{margin:0;font-family:system-ui;background:#f5f5f5;padding:16px}
.card{max-width:420px;margin:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.1);text-align:center}
.logo{font-size:28px;font-weight:900} .logo span{color:#ff6a00}
.qr{width:240px;height:240px;margin:16px auto;background:#fff;border:2px dashed #ff6a00;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:11px;padding:10px;word-break:break-all}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:15px;margin-top:10px}
.btn-orange{background:#ff6a00;color:#fff}
.btn-black{background:#111;color:#fff}
small{color:#666;font-size:11px;word-break:break-all;display:block;margin-top:10px;background:#f9f9f9;padding:10px;border-radius:10px}
</style>
</head>
<body>
<div class="card">
<div class="logo">Dion <span>NFC</span></div>
<div style="font-size:12px;color:#888" id="lojaNome">Carregando...</div>
<div class="qr" id="qrArea">QR Code Pix aqui<br>Use o botão copiar</div>
<h3 style="margin:10px 0 5px" id="tagId">CAIXA01</h3>
<div id="status" style="font-size:12px;color:#16a34a">✅ Código Pix pronto</div>
<button class="btn btn-orange" onclick="copiarPix()">📋 COPIAR CÓDIGO PIX</button>
<button class="btn btn-black" onclick="abrirBanco()">🏦 ABRIR MEU BANCO</button>
<small id="codigoPix">Carregando código...</small>
<div style="margin-top:14px;font-size:10px;color:#999">Encoste novamente ou copie e cole no app do seu banco > Pix Copia e Cola</div>
</div>
<script>
function getParam(n){return new URLSearchParams(location.search).get(n)||''}
let codigoB64=getParam('codigoB64');let tag=getParam('tag')||'CAIXA01';let loja=getParam('loja')||'Dion NFC';
document.getElementById('tagId').innerText=tag;document.getElementById('lojaNome').innerText=loja;
let codigo='';
try{codigo=decodeURIComponent(escape(atob(decodeURIComponent(codigoB64)))));}catch(e){codigo=codigoB64;}
if(!codigo||codigo.length<10){document.getElementById('codigoPix').innerText='Erro: codigo não encontrado';}
else{document.getElementById('codigoPix').innerText=codigo;document.getElementById('qrArea').innerText=codigo.substring(0,120)+'...';}
function copiarPix(){navigator.clipboard.writeText(codigo).then(()=>{document.getElementById('status').innerText='✅ COPIADO! Cole no seu banco';alert('✅ Código Pix copiado! Agora abre seu banco > Pix > Pix Copia e Cola > Colar');}).catch(()=>{prompt('Copie manualmente:',codigo);});}
function abrirBanco(){copiarPix();setTimeout(()=>{window.location.href='pix://'+codigo;},500);}
// salva log simples
let logs=JSON.parse(localStorage.getItem('dion_logs_pay')||'[]');logs.unshift({tag,loja,data:new Date().toLocaleString()});localStorage.setItem('dion_logs_pay',JSON.stringify(logs.slice(0,100)));
</script>
</body>
</html>
