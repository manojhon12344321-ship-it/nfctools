<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TagFlow - NFC 100% Funcional</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#0f0f0f;color:#fff;padding:16px}
.header{text-align:center;padding:20px 0}
.header h1{font-size:28px;color:#ff6a00}
.card{background:#1a1a1a;border-radius:16px;padding:16px;margin-bottom:16px;border:1px solid #2a2a2a}
.card h2{font-size:16px;margin-bottom:12px;color:#ff6a00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:#252525;border:1px solid #333;border-radius:12px;padding:14px 10px;color:#fff;font-size:13px;cursor:pointer}
.btn:active{background:#ff6a00}
.btn.pay{background:linear-gradient(135deg,#6a00ff,#ff6a00);border:none}
input{width:100%;background:#0f0f0f;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;margin:8px 0}
.write-btn{width:100%;background:#ff6a00;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:700;color:#fff;margin-top:12px}
.status{margin-top:12px;padding:12px;border-radius:10px;background:#111;text-align:center;display:none}
</style>
</head>
<body>
<div class="header"><h1>TagFlow v1.0 - FUNCIONAL</h1><p style="color:#888">Grava na TAG de verdade</p></div>

<div class="card">
<h2>📍 Localização (do seu print)</h2>
<div class="grid">
<button class="btn" onclick="setType('geo_custom')">📍 Local. personalizada</button>
<button class="btn" onclick="setType('endereco')">🏠 Endereço</button>
<button class="btn" onclick="setType('destino')">🚩 Endereço de destino</button>
<button class="btn" onclick="setType('proximidades')">🔍 Pesquisa proximidades</button>
<button class="btn" onclick="setType('streetview')">👁️ Vista da rua</button>
<button class="btn" onclick="setType('emergencia')">🚨 Emergência</button>
</div>
</div>

<div class="card">
<h2>💳 Pagamentos Nubank + 19</h2>
<div class="grid">
<button class="btn pay" onclick="setType('pix')">💠 Pix</button>
<button class="btn pay" onclick="setType('nubank')">💜 Nubank</button>
<button class="btn pay" onclick="setType('paypal')">💙 PayPal</button>
<button class="btn pay" onclick="setType('bitcoin')">₿ Bitcoin</button>
<button class="btn pay" onclick="setType('link_universal')">🔗 Link Universal</button>
<button class="btn pay" onclick="setType('mercadopago')">💚 Mercado Pago</button>
</div>
</div>

<div class="card" id="formCard" style="display:none">
<h2 id="formTitle"></h2>
<input id="inputData" placeholder="Digite aqui...">
<button class="write-btn" onclick="gravarNFC()">📲 GRAVAR NA TAG NFC AGORA</button>
<div id="status" class="status"></div>
</div>

<script>
let currentType='';
function setType(t){currentType=t;document.getElementById('formCard').style.display='block';document.getElementById('formTitle').innerText=t;document.getElementById('inputData').value=t==='emergencia'?'190':'';window.scrollTo(0,9999)}
async function gravarNFC(){
 const dado=document.getElementById('inputData').value.trim();
 if(!dado) return alert('Digite algo');
 if(!('NDEFReader' in window)) return alert('Use Chrome no Android com NFC ligado');
 try{
  document.getElementById('status').style.display='block';
  document.getElementById('status').innerText='Aproxime a TAG agora...';
  const ndef=new NDEFReader();
  let url=dado;
  if(currentType==='endereco') url='geo:0,0?q='+encodeURIComponent(dado);
  if(currentType==='destino') url='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dado);
  if(currentType==='geo_custom') url='geo:'+dado;
  if(currentType==='proximidades') url='geo:0,0?q='+encodeURIComponent(dado);
  if(currentType==='streetview') url='https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+dado;
  if(currentType==='emergencia') url='tel:190';
  if(currentType==='nubank') url='https://nubank.com.br/pagar/'+dado;
  if(currentType==='paypal') url='https://paypal.me/'+dado;
  if(currentType==='bitcoin') url='bitcoin:'+dado;
  await ndef.write({records:[{recordType:'url',data:url}]});
  document.getElementById('status').innerText='✅ GRAVADO COM SUCESSO!';
 }catch(e){document.getElementById('status').innerText='Erro: '+e.message}
}
</script>
</body>
</html>
