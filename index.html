<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dion NFC - Completo</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#ff6a00"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f8f8fa;padding:12px;padding-bottom:130px}.top{padding:18px;background:#fff;border-radius:20px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}.top h1{font-size:28px;font-weight:900}.top span{color:#ff6a00}.tabs{display:flex;gap:6px;padding:10px;background:#fff;border-radius:16px;margin-bottom:12px;overflow-x:auto}.tab{font-size:12px;color:#888;padding:9px 11px;border-radius:20px;cursor:pointer;white-space:nowrap}.tab.active{background:#ff6a00;color:#fff;font-weight:800}.card{background:#fff;border-radius:20px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.btn{background:#f5f5f7;border:1px solid #eee;border-radius:16px;padding:12px 4px;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}.btn b{font-size:20px}.btn.pay{background:#111;color:#fff}.btn.rast{background:#ff6a00;color:#fff;border:none}.formCard{background:#fff;border:2px solid #ff6a00;border-radius:20px;padding:18px;margin-top:12px;display:none}.field{margin-bottom:14px}label{font-size:11px;font-weight:800;color:#111;text-transform:uppercase;display:block;margin-bottom:4px}.help{font-size:10px;color:#777;margin-top:3px;line-height:1.3}.ex{font-size:10px;color:#ff6a00;background:#fff7ed;padding:4px 7px;border-radius:6px;margin-top:4px;display:inline-block}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:13px}textarea{min-height:65px}.write{width:100%;background:#ff6a00;border:none;border-radius:14px;padding:16px;font-weight:900;color:#fff;margin-top:14px;font-size:15px;cursor:pointer}.status{margin-top:12px;padding:12px;border-radius:10px;text-align:center;display:none;font-weight:800;font-size:12px}.counter{background:#ff6a00;color:#fff;font-size:10px;padding:2px 7px;border-radius:10px}</style></head><body>
<div class="top"><h1>Dion <span>NFC</span></h1><p style="font-size:11px;color:#888;margin-top:4px">App Completo PWA + Rastreável - Todas funções especificadas</p></div>
<div class="tabs"><div class="tab active" id="t-padrao" onclick="switchTab('padrao')">✏️ Escrever</div><div class="tab" id="t-local" onclick="switchTab('local')">📍 Local</div><div class="tab" id="t-pag" onclick="switchTab('pag')">💳 Pag</div><div class="tab" id="t-outros" onclick="switchTab('outros')">🛠️ Outros</div><div class="tab" id="t-minhas" onclick="switchTab('minhas')">📚 Minhas <span id="tagCount" class="counter" style="display:none">0</span></div></div>
<div id="sec-padrao" class="card"><div class="grid"><button class="btn" onclick="openF('url')"><b>🌐</b>URL / Site</button><button class="btn" onclick="openF('texto')"><b>📝</b>Texto</button><button class="btn" onclick="openF('email')"><b>📧</b>Email</button><button class="btn" onclick="openF('telefone')"><b>📞</b>Telefone</button><button class="btn" onclick="openF('sms')"><b>💬</b>SMS</button><button class="btn" onclick="openF('wifi')"><b>📶</b>WiFi</button><button class="btn" onclick="openF('bluetooth')"><b>🔵</b>BT</button><button class="btn" onclick="openF('contato')"><b>👤</b>Contato</button><button class="btn" onclick="openF('app')"><b>📲</b>App</button><button class="btn" onclick="openF('youtube')"><b>▶️</b>YouTube</button></div></div>
<div id="sec-local" class="card" style="display:none"><div class="grid"><button class="btn" onclick="openF('local_personalizada')"><b>📍</b>Local Nome</button><button class="btn" onclick="openF('endereco')"><b>🏠</b>Endereço</button><button class="btn" onclick="openF('destino')"><b>🚩</b>Rota</button><button class="btn" onclick="openF('proximidades')"><b>🔍</b>Buscar Perto</button><button class="btn" onclick="openF('coordenada')"><b>📌</b>GPS</button><button class="btn" onclick="openF('maps')"><b>🗺️</b>Maps Link</button></div></div>
<div id="sec-pag" class="card" style="display:none"><div class="grid"><button class="btn rast" onclick="openF('pay_rastreavel')"><b>🔗</b>LINK RASTREÁVEL</button><button class="btn pay" onclick="openF('pix')"><b>💠</b>Pix EMV</button><button class="btn pay" onclick="openF('pix_id')"><b>🆔</b>Pix Copia e Cola</button><button class="btn pay" onclick="openF('nubank')"><b>💜</b>Nubank</button><button class="btn pay" onclick="openF('mercadopago')"><b>💚</b>Mercado Pago</button><button class="btn pay" onclick="openF('link_universal')"><b>🌐</b>Link Pago</button><button class="btn pay" onclick="openF('picpay')"><b>💛</b>PicPay</button><button class="btn pay" onclick="openF('ifood')"><b>🍔</b>iFood</button></div></div>
<div id="sec-outros" class="card" style="display:none"><div class="grid"><button class="btn" onclick="openF('copiar_tag')"><b>📋</b>Copiar TAG</button><button class="btn" onclick="apagarTag()"><b>🗑️</b>Apagar</button><button class="btn" onclick="lerTag()"><b>👁️</b>Ler</button><button class="btn" onclick="verLogs()"><b>📊</b>Logs</button><button class="btn" onclick="exportarBackup()"><b>💾</b>Backup</button><button class="btn" onclick="document.getElementById('importFile').click()"><b>📥</b>Import</button></div><input type="file" id="importFile" style="display:none" onchange="importarBackup(this)"></div>
<div id="sec-minhas" class="card" style="display:none"><div id="tagsList"></div><div id="logsList" style="display:none;margin-top:12px"></div></div>
<div id="formCard" class="formCard"><h2 id="formTitle" style="color:#ff6a00;font-size:17px"></h2><p id="formDesc" style="font-size:12px;color:#555;margin:6px 0 14px;line-height:1.4"></p><div id="formFields"></div><div class="field"><label>🏷️ NOME DA TAG (PARA VOCÊ IDENTIFICAR)</label><input id="f_nomeTag" placeholder="Ex: Dion - Caixa 01 - Frente"><div class="help">Esse nome não vai pra TAG, só aparece em Minhas TAGs pra você organizar</div></div><button class="write" onclick="gravar()">📲 GRAVAR NA TAG NFC</button><div id="status" class="status"></div><div id="qrArea" style="text-align:center;display:none;margin-top:14px"><img id="qrImg" style="width:190px;border-radius:12px;border:1px solid #eee"><p style="font-size:11px;color:#888;margin-top:6px">QR Code com mesmo conteúdo</p></div></div><script>
let tags=[];try{tags=JSON.parse(localStorage.getItem('dion_nfc_v2')||'[]')}catch(e){tags=[]}
let current="";let copiedData="";
function saveTags(){localStorage.setItem('dion_nfc_v2',JSON.stringify(tags));updateCounter();renderTags()}
function updateCounter(){let c=document.getElementById('tagCount');c.style.display=tags.length?'inline':'none';c.innerText=tags.length}updateCounter();
let forms={
url:{title:'🌐 URL / Site - Link que abre direto',desc:'Grava um link. Quando a pessoa encostar o celular, abre direto no navegador. Ideal pra Instagram, site, cardápio.',fields:[{id:'proto',label:'PROTOCOLO - Como o link começa (use https)',type:'select',opts:['https://','http://'],help:'Sempre use https:// - funciona em 100% dos celulares e é seguro',ex:'Exemplo: https://',ph:''},{id:'url',label:'ENDEREÇO DO SITE - Sem o https',help:'Digite domínio + caminho',ex:'Ex: instagram.com/dionnfc ou www.dionnfc.com.br/produto',ph:'instagram.com/dionnfc'}],build:d=>d.proto+d.url},
texto:{title:'📝 Texto Livre - Mensagem na TAG',desc:'Grava qualquer texto puro. Ideal pra instruções, senha do WiFi escrita, recado, código interno.',fields:[{id:'txt',label:'TEXTO COMPLETO - O que vai aparecer quando ler',type:'textarea',help:'Pode ser até 200 caracteres em TAG pequena',ex:'Ex: WiFi Dion: senha dion2024 | Caixa 01 - Frente',ph:'Digite seu texto aqui...'}],build:d=>d.txt,type:'text'},
email:{title:'📧 E-mail Pronto',desc:'Abre app de e-mail já com destinatário, assunto e mensagem preenchidos.',fields:[{id:'mail',label:'E-MAIL DESTINATÁRIO - Pra quem vai',help:'Email completo',ex:'Ex: contato@dion.com.br',ph:'contato@dion.com.br'},{id:'assunto',label:'ASSUNTO - Título do e-mail (opcional)',ph:'Orçamento',ex:'Ex: Orçamento TAG NFC'},{id:'corpo',label:'MENSAGEM - Corpo do e-mail (opcional)',type:'textarea',ph:'Olá, vim pela TAG NFC...',ex:'Ex: Olá...'}],build:d=>{let m='mailto:'+d.mail;let q=[];if(d.assunto)q.push('subject='+encodeURIComponent(d.assunto));if(d.corpo)q.push('body='+encodeURIComponent(d.corpo));return q.length?m+'?'+q.join('&'):m}},
telefone:{title:'📞 Ligação - Discar Direto',desc:'Grava telefone que quando encostar já liga. Ótimo pra delivery, suporte.',fields:[{id:'tel',label:'NÚMERO COM DDD - Só números, sem espaço',help:'Coloque DDD, 11 dígitos',ex:'Ex: 73999999999',ph:'73999999999'}],build:d=>'tel:'+d.tel},
sms:{title:'💬 SMS Pronto',desc:'Abre SMS já com número e texto pronto pra enviar.',fields:[{id:'num',label:'NÚMERO DESTINATÁRIO',ph:'73999999999',ex:'Ex: 73999999999'},{id:'msg',label:'MENSAGEM DO SMS - Texto que vai pronto',type:'textarea',ph:'Olá! Vim pela TAG',ex:'Ex: Olá, quero orçamento'}],build:d=>'sms:'+d.num+'?body='+encodeURIComponent(d.msg||'')},
wifi:{title:'📶 Wi-Fi Automático - Conecta Sem Digitar Senha',desc:'MAIS VENDIDO! Pessoa encosta e conecta no WiFi automaticamente sem digitar senha. Ideal pra loja, bar, restaurante.',fields:[{id:'ssid',label:'NOME DA REDE WiFi (SSID) - Nome exato que aparece na lista',help:'Respeita maiúsculas e espaços, tem que ser idêntico',ex:'Ex: Dion_Loja_5G ou NET-1234',ph:'Dion_Loja_5G'},{id:'pass',label:'SENHA DO WiFi - Senha exata',help:'Senha que está no roteador',ex:'Ex: dion2024@',ph:'sua senha'},{id:'sec',label:'TIPO DE SEGURANÇA - Quase sempre WPA',type:'select',opts:['WPA','WEP','nopass'],help:'WPA é o padrão hoje',ex:'Ex: WPA'}],build:d=>`WIFI:T:${d.sec||'WPA'};S:${d.ssid};P:${d.pass};;`},
bluetooth:{title:'🔵 Bluetooth - Parear Rápido',desc:'Grava MAC do aparelho Bluetooth.',fields:[{id:'mac',label:'ENDEREÇO MAC - Formato XX:XX:XX:XX:XX:XX',ph:'00:11:22:33:44:55',ex:'Ex: 00:11:22:33:44:55'},{id:'nome',label:'NOME DO APARELHO (opcional)',ph:'Caixa JBL Dion',ex:'Ex: Caixa JBL'}],build:d=>'BT:'+(d.mac||d.nome)},
contato:{title:'👤 Contato VCARD - Cartão Digital na Agenda',desc:'Salva contato completo direto na agenda da pessoa com um toque.',fields:[{id:'nome',label:'NOME COMPLETO',ph:'Dion Santos',ex:'Ex: Dion Santos'},{id:'tel',label:'TELEFONE',ph:'73999999999',ex:'Ex: 73999999999'},{id:'email',label:'E-MAIL',ph:'contato@dion.com.br',ex:'Ex: contato@dion.com.br'},{id:'empresa',label:'EMPRESA (opcional)',ph:'Dion NFC',ex:'Ex: Dion NFC'}],build:d=>`BEGIN:VCARD\nVERSION:3.0\nFN:${d.nome}\nTEL:${d.tel}\nEMAIL:${d.email}\nORG:${d.empresa||''}\nEND:VCARD`,type:'text'},
app:{title:'📲 App Play Store',desc:'Abre direto página do app na Play Store.',fields:[{id:'pkg',label:'PACKAGE NAME - ID do app (pegue no link depois de id=)',help:'Ex: link play.google.com/...?id=com.whatsapp => com.whatsapp',ex:'Ex: com.whatsapp',ph:'com.dion.app'}],build:d=>'market://details?id='+d.pkg},
youtube:{title:'▶️ YouTube - Vídeo Direto',desc:'Abre vídeo direto no app do YouTube.',fields:[{id:'url',label:'LINK COMPLETO DO VÍDEO',help:'Cole link completo do YouTube',ex:'Ex: https://youtube.com/watch?v=abc123',ph:'https://youtube.com/watch?v='}],build:d=>d.url},
local_personalizada:{title:'📍 Local com Nome Personalizado',desc:'Grava coordenada GPS que abre no Maps já com nome do local.',fields:[{id:'lat',label:'LATITUDE - Pegue no Google Maps clicando no local',ex:'Ex: -17.865234',ph:'-17.865234'},{id:'lng',label:'LONGITUDE',ex:'Ex: -39.567890',ph:'-39.567890'},{id:'nome',label:'NOME DO LOCAL - O que aparece no Maps',ex:'Ex: Loja Dion - Centro Teixeira',ph:'Loja Dion'}],build:d=>`geo:${d.lat},${d.lng}?q=${d.lat},${d.lng}(${encodeURIComponent(d.nome)})`},
endereco:{title:'🏠 Endereço Completo - Buscar no Maps',desc:'Abre Maps pesquisando endereço completo.',fields:[{id:'end',label:'ENDEREÇO COMPLETO - Rua, número, bairro, cidade, estado',help:'Quanto mais completo melhor o Maps acha',ex:'Ex: Av Getulio Vargas 100, Centro, Teixeira de Freitas BA',ph:'Av Getulio Vargas 100, Teixeira BA'}],build:d=>'geo:0,0?q='+encodeURIComponent(d.end)},
destino:{title:'🚩 Rota / Como Chegar Até Você',desc:'Já abre rota pronta até seu estabelecimento.',fields:[{id:'dest',label:'DESTINO - Seu endereço / nome da loja',ex:'Ex: Loja Dion, Av Getulio Vargas 100 Teixeira',ph:'Loja Dion'}],build:d=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(d.dest)},
proximidades:{title:'🔍 Buscar Perto - O que tem perto de mim',desc:'Pesquisa estabelecimentos perto da pessoa.',fields:[{id:'q',label:'O QUE BUSCAR - Ex: pizzaria, farmácia, banco 24h',ex:'Ex: pizzaria aberta agora',ph:'pizzaria'}],build:d=>'geo:0,0?q='+encodeURIComponent(d.q)},
coordenada:{title:'📌 Coordenada GPS Pura',desc:'Só latitude e longitude sem nome.',fields:[{id:'lat',label:'LATITUDE',ph:'-17.123'},{id:'lng',label:'LONGITUDE',ph:'-39.123'}],build:d=>'geo:'+d.lat+','+d.lng},
maps:{title:'🗺️ Link Google Maps Qualquer',desc:'Qualquer link do Google Maps encurtado ou completo.',fields:[{id:'url',label:'LINK DO MAPS',ph:'https://maps.app.goo.gl/...',ex:'Ex: https://maps.app.goo.gl/abc123'}],build:d=>d.url},
pay_rastreavel:{title:'🔗 LINK RASTREÁVEL - PÁGINA BONITA + RASTREIO (USE ESSE PRA VENDER)',desc:'ESSE É O MAIS IMPORTANTE! Gera link curto que abre PÁGINA LINDA laranja com seu logo, valor, loja, TAG. Quando cliente paga, grava LOG de qual TAG, loja, valor e hora. RASTREÁVEL!',fields:[{id:'chave',label:'🔑 CHAVE PIX OBRIGATÓRIA - Sua chave Pix (CPF, celular, email, aleatória)',help:'Chave que vai receber dinheiro',ex:'Ex: 12345678900 ou 73999999999',ph:'Sua chave Pix'},{id:'nome',label:'👤 SEU NOME - Nome recebedor (máx 25 letras, aparece no banco)',help:'Nome que aparece pro pagador',ex:'Ex: Dion Santos',ph:'DION'},{id:'cidade',label:'🏙️ CIDADE - Sua cidade (15 letras)',ex:'Ex: Teixeira de Freitas',ph:'TEIXEIRA'},{id:'valor',label:'💰 VALOR FIXO - Deixe vazio se quiser valor livre pro cliente escolher',help:'Se vazio cliente digita valor',ex:'Ex: 10.00, 25.50 ou deixe vazio',ph:'10.00'},{id:'tagid',label:'🏷️ ID DA TAG - IDENTIFICA QUAL TAG FOI USADA - MUITO IMPORTANTE',help:'Ex: CAIXA01, MESA05, PORTA_ENTRADA. Pra saber onde pagaram',ex:'Ex: CAIXA01',ph:'CAIXA01'},{id:'loja',label:'🏪 NOME DA LOJA - Nome que aparece na página bonita',ex:'Ex: Dion NFC - Loja Centro',ph:'Dion NFC'}],build:d=>'https://manojhon12344321-ship-it.github.io/nfctools/pay.html?chave='+encodeURIComponent(d.chave)+'&nome='+encodeURIComponent(d.nome||'DION')+'&cidade='+encodeURIComponent(d.cidade||'TEIXEIRA')+'&valor='+encodeURIComponent(d.valor||'')+'&tag='+encodeURIComponent(d.tagid||'CAIXA01')+'&loja='+encodeURIComponent(d.loja||'Dion NFC')},
pix:{title:'💠 Pix EMV Oficial Banco Central - Código Puro',desc:'Gera código EMV oficial que cola direto no app do banco. ATENÇÃO: Código grande NÃO cabe em TAG pequena NTAG213, use LINK RASTREÁVEL pra TAG.',fields:[{id:'chave',label:'CHAVE PIX',ph:'chave'},{id:'nome',label:'NOME (25 letras)',ph:'DION'},{id:'cidade',label:'CIDADE (15 letras)',ph:'TEIXEIRA'},{id:'valor',label:'VALOR',ph:'10.00'}],build:d=>gerarPixEMV(d.chave,d.nome,d.cidade,d.valor,'DIONNFC'),type:'text'},
pix_id:{title:'🆔 Pix Copia e Cola Puro',desc:'Cole seu código Pix copia e cola completo que seu banco gerou.',fields:[{id:'codigo',label:'CÓDIGO PIX COMPLETO - Cole tudo que começa com 000201',type:'textarea',ph:'00020126...',ex:'Ex: 000201...'}],build:d=>d.codigo,type:'text'},
nubank:{title:'💜 Nubank - Link',fields:[{id:'url',label:'LINK NUBANK',ph:'https://nubank.com.br/pagar/...',ex:'Ex: https://nubank.com.br/...'}],build:d=>d.url},
mercadopago:{title:'💚 Mercado Pago - Link',fields:[{id:'url',label:'LINK MERCADO PAGO',ph:'https://mpago.la/...',ex:'Ex: https://mpago.la/abc'}],build:d=>d.url},
link_universal:{title:'🌐 Link Pagamento Universal',desc:'Qualquer link: Stripe, PagSeguro, Cielo, etc',fields:[{id:'url',label:'LINK DE PAGAMENTO',ph:'https://...',ex:'Ex: https://pagseguro.com.br/...'}],build:d=>d.url},
picpay:{title:'💛 PicPay - Link',fields:[{id:'url',label:'LINK PICPAY',ph:'https://picpay.me/...',ex:'Ex: https://picpay.me/dion'}],build:d=>d.url},
ifood:{title:'🍔 iFood - Link Loja',fields:[{id:'url',label:'LINK IFOOD LOJA',ph:'https://ifood.com.br/loja/...',ex:'Ex: https://ifood.com.br/...'}],build:d=>d.url},
copiar_tag:{title:'📋 Copiar Conteúdo de TAG',desc:'Use Ler TAG primeiro, depois vem aqui pra copiar.',fields:[],build:()=>copiedData},
};
function switchTab(n){['padrao','local','pag','outros','minhas'].forEach(s=>{let e=document.getElementById('sec-'+s);if(e)e.style.display=(s===n)?'block':'none';let t=document.getElementById('t-'+s);if(t){if(s===n)t.classList.add('active');else t.classList.remove('active');}});document.getElementById('formCard').style.display='none';if(n==='minhas')renderTags();}
function openF(k){current=k;let c=forms[k];if(!c)return;let fc=document.getElementById('formCard');fc.style.display='block';document.getElementById('formTitle').innerText=c.title;document.getElementById('formDesc').innerText=c.desc||'';let h='';if(c.fields){c.fields.forEach(f=>{if(f.type==='select'){h+=`<div class="field"><label>${f.label}</label><select id="f_${f.id}">${f.opts.map(o=>`<option>${o}</option>`).join('')}</select><div class="help">${f.help||''}</div>${f.ex?`<div class="ex">${f.ex}</div>`:''}</div>`}else if(f.type==='textarea'){h+=`<div class="field"><label>${f.label}</label><textarea id="f_${f.id}" placeholder="${f.ph||''}"></textarea><div class="help">${f.help||''}</div>${f.ex?`<div class="ex">${f.ex}</div>`:''}</div>`}else{h+=`<div class="field"><label>${f.label}</label><input id="f_${f.id}" placeholder="${f.ph||''}"><div class="help">${f.help||''}</div>${f.ex?`<div class="ex">${f.ex}</div>`:''}</div>`}});}if(c.fields.length===0){h+=`<div class="field"><p style="font-size:12px">Conteúdo copiado: <b>${copiedData.substring(0,80)||'Nenhum - use Ler TAG antes'}</b></p></div>`}document.getElementById('formFields').innerHTML=h;document.getElementById('status').style.display='none';document.getElementById('qrArea').style.display='none';window.scrollTo(0,document.body.scrollHeight);}
function gerarPixEMV(chave,nome,cidade,valor,txid){nome=(nome||'RECEBEDOR').toUpperCase().substring(0,25);cidade=(cidade||'BRASIL').toUpperCase().substring(0,15);function tlv(id,v){return id+String(v.length).padStart(2,'0')+v}let pay=tlv('00','br.gov.bcb.pix')+tlv('01',chave||'');let ma=tlv('26',pay);let p=tlv('00','01')+tlv('01','12')+ma+tlv('52','0000')+tlv('53','986')+(valor?tlv('54',parseFloat(valor).toFixed(2)):'')+tlv('58','BR')+tlv('59',nome)+tlv('60',cidade)+tlv('62',tlv('05',txid));let w=p+'6304';let crc=0xFFFF;for(let i=0;i<w.length;i++){crc^=w.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=crc&0x8000?(crc<<1)^0x1021:crc<<1;crc&=0xFFFF}return w+crc.toString(16).toUpperCase().padStart(4,'0');}
async function gravar(){let c=forms[current];if(!c)return;let d={};if(c.fields)c.fields.forEach(f=>{let el=document.getElementById('f_'+f.id);if(el)d[f.id]=el.value.trim();});let finalData=c.build(d);let nomeTag=document.getElementById('f_nomeTag').value.trim()||c.title;if(!finalData){showS('Preencha todos os campos obrigatórios','err');return;}if(!('NDEFReader' in window)){showS('Use Chrome no Android com NFC ligado','err');return;}try{showS('🔍 Aproxime a TAG NFC do celular e segure...','info');let ndef=new NDEFReader();let rec=(c.type==='text')?{recordType:'text',data:finalData}:{recordType:'url',data:finalData};await ndef.write({records:[rec]});tags.unshift({id:Date.now(),nome:nomeTag,tipo:c.title,dado:finalData,data:new Date().toLocaleString()});saveTags();showS('✅ GRAVADO COM SUCESSO: '+nomeTag,'ok');gerarQR(finalData);}catch(e){showS('❌ Erro: '+e.message,'err');}}
function renderTags(){let l=document.getElementById('tagsList');if(tags.length===0){l.innerHTML='<p style="color:#888;font-size:13px;text-align:center;padding:20px">Nenhuma TAG salva ainda.<br>Grave uma TAG que ela aparece aqui com nome, tipo e conteúdo.</p>';return;}l.innerHTML=tags.map(t=>`<div style="border:1px solid #eee;border-radius:14px;padding:12px;margin-bottom:10px"><b>${t.nome}</b><br><small style="color:#888">${t.tipo} - ${t.data}</small><p style="font-size:11px;word-break:break-all;background:#fafafa;padding:8px;border-radius:8px;margin-top:6px">${t.dado.substring(0,250)}</p><div style="margin-top:6px"><button onclick="gerarQR('${t.dado.replace(/'/g,"")}')" style="padding:6px 12px;border-radius:8px;border:1px solid #eee;background:#fff">QR</button> <button onclick="delTag(${t.id})" style="padding:6px 12px;border-radius:8px;border:1px solid #fcc;color:#c00;background:#fff">Apagar</button></div></div>`).join('');}
function delTag(id){if(confirm('Apagar essa TAG da lista?')){tags=tags.filter(x=>x.id!==id);saveTags();}}
function gerarQR(txt){let img=document.getElementById('qrImg');let area=document.getElementById('qrArea');area.style.display='block';img.src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(txt);document.getElementById('formCard').style.display='block';}
async function lerTag(){try{let n=new NDEFReader();await n.scan();showS('Aproxime a TAG para ler...','info');n.onreading=e=>{let dec=new TextDecoder();let t='';for(let r of e.message.records){try{t+=dec.decode(r.data)}catch{t+=r.data}}copiedData=t;showS('✅ LIDO: '+t.substring(0,120),'ok');gerarQR(t);};}catch(e){showS('Erro: '+e.message,'err');}}
async function apagarTag(){try{let n=new NDEFReader();await n.write({records:[]});showS('TAG apagada com sucesso!','ok');}catch(e){showS('Erro ao apagar: '+e.message,'err');}}
function exportarBackup(){let b=new Blob([JSON.stringify(tags)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dion-nfc-backup.json';a.click();showS('Backup baixado!','ok');}
function importarBackup(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{try{tags=JSON.parse(e.target.result).concat(tags);saveTags();showS('Backup importado!','ok');}catch{showS('Arquivo inválido','err');}};r.readAsText(f);}
function verLogs(){let logs=JSON.parse(localStorage.getItem('dion_logs')||'[]');let l=document.getElementById('logsList');l.style.display=l.style.display==='none'?'block':'none';if(logs.length===0){l.innerHTML='<p style="color:#888;text-align:center;padding:10px">Nenhum pagamento rastreado ainda.<br>Quando alguém pagar usando seu link rastreável, aparece aqui com TAG, loja, valor e hora.</p>'}else{l.innerHTML=logs.map(x=>`<div style="border:1px solid #eee;padding:10px;margin-bottom:8px;border-radius:12px;background:#fff"><small>📅 ${new Date(x.data).toLocaleString()}<br>🏪 Loja: ${x.loja} | 🏷️ TAG: ${x.tag}<br>💰 Valor: R$ ${x.valor||'livre'} | Chave: ${x.chave.substring(0,15)}...</small></div>`).join('')}}
function showS(m,t){let s=document.getElementById('status');s.style.display='block';s.innerText=m;s.style.background=t==='ok'?'#e8f5e9':t==='err'?'#ffebee':'#fff3e0';s.style.color=t==='ok'?'#2e7d32':t==='err'?'#c62828':'#e65100';}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>console.log('SW ok'))}
</script></body></html>
