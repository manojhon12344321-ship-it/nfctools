<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dion NFC - Completo PWA + Rastreavel - FIX</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ff6a00">
<style>
*{box-sizing:border-box}
body{font-family:Arial, sans-serif;background:#0e0e0e;color:#fff;margin:0;padding:10px;padding-bottom:90px}
.topo{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;padding:5px 0}
.topo button{padding:10px 18px;border-radius:20px;border:1px solid #333;background:#1e1e1e;color:#fff;font-weight:bold}
.topo button.ativo{background:#ff6a00;color:#000;border-color:#ff6a00}
.card{background:#1e1e1e;border-radius:16px;padding:14px;margin-top:14px;border:1px solid #2a2a2a}
.titulo-laranja{color:#ff6a00;font-weight:bold;font-size:14px;margin:10px 0 6px 0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn-opcao{background:#000;border:1px solid #333;border-radius:14px;padding:14px 5px;color:#fff;text-align:center;font-size:12px;font-weight:bold}
.btn-opcao.ativo{border-color:#ff6a00;background:#ff6a00;color:#000}
input, select{width:100%;padding:14px;border-radius:12px;border:2px solid #333;background:#000;color:#fff;margin:6px 0;outline:none}
input:focus{border-color:#ff6a00}
#btnGravar{width:100%;padding:18px;background:#ff6a00;border:none;border-radius:12px;font-weight:bold;font-size:18px;color:#000;margin-top:12px}
#btnApagar{width:100%;padding:16px;background:#111;border:2px solid #ef4444;border-radius:12px;font-weight:bold;font-size:16px;color:#ef4444;margin-top:10px;display:block}
#status{text-align:center;margin-top:12px;font-weight:bold;font-size:16px;min-height:24px;background:#000;padding:10px;border-radius:8px;border:1px solid #333}
.aba{display:none}.aba.ativa{display:block}
</style>
</head>
<body>

<div class="topo">
 <button class="ativo" id="t-escrever" onclick="mudarAba('escrever')">Escrever</button>
 <button id="t-local" onclick="mudarAba('local')">Local</button>
 <button id="t-pag" onclick="mudarAba('pag')">Pag</button>
 <button id="t-outros" onclick="mudarAba('outros')">Outros</button>
 <button id="t-minhas" onclick="mudarAba('minhas')">Minhas</button>
</div>

<div id="aba-escrever" class="aba ativa">
  <div class="card">
    <div class="titulo-laranja">TIPO DE CONTEÚDO</div>
    <div class="grid3">
      <div class="btn-opcao ativo" id="op-url" onclick="setTipo('url')">🔗<br>LINK<br>RASTREAVEL</div>
      <div class="btn-opcao" id="op-pixemv" onclick="setTipo('pixemv')">Pix<br>EMV</div>
      <div class="btn-opcao" id="op-pixid" onclick="setTipo('pixid')">Pix<br>ID</div>
      <div class="btn-opcao" id="op-linkgen" onclick="setTipo('linkgen')">🌐<br>Link<br>Genérico</div>
      <div class="btn-opcao" id="op-texto" onclick="setTipo('texto')">📝<br>Texto<br>Livre</div>
      <div class="btn-opcao" id="op-wifi" onclick="setTipo('wifi')">📶<br>WiFi</div>
    </div>

    <div class="titulo-laranja">LINK GENERICO</div>
    <input id="inputLink" type="url" placeholder="https://g.page/r/seu-link-de-avaliacao-google">
    <small style="color:#888">Cole aqui o link de Avaliação do Google.</small>

    <div class="titulo-laranja">NOME DA TAG</div>
    <input id="inputNome" placeholder="Ex: Avaliação Google Loja Centro">

    <button id="btnGravar">📲 GRAVAR NA TAG</button>
    <button id="btnApagar" onclick="apagarTag()">🗑️ APAGAR TAG - LIMPAR LINK</button>
    <div id="status">Pronto pra gravar</div>
  </div>
</div>

<div id="aba-pag" class="aba"><div class="card"><div class="titulo-laranja">PAGAMENTO / PIX</div><input id="pixChave" placeholder="Sua chave PIX"><input id="pixValor" placeholder="Valor opcional"><button class="btn-opcao" style="width:100%;margin-top:10px" onclick="gerarPixLink()">Gerar Link PIX</button></div></div>
<div id="aba-local" class="aba"><div class="card">Função Local</div></div>
<div id="aba-outros" class="aba"><div class="card">Função WiFi e outras</div></div>
<div id="aba-minhas" class="aba"><div class="card"><div class="titulo-laranja">MINHAS TAGS</div><div id="listaTags"></div></div></div>

<script>
let tipoAtual = 'url';
function setTipo(t){
  tipoAtual=t;
  document.querySelectorAll('.btn-opcao').forEach(b=>b.classList.remove('ativo'));
  document.getElementById('op-'+t).classList.add('ativo');
  document.getElementById('status').innerText='Modo: '+t.toUpperCase();
}
function mudarAba(nome){
  document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));
  document.querySelectorAll('.topo button').forEach(b=>b.classList.remove('ativo'));
  document.getElementById('aba-'+nome).classList.add('ativa');
  document.getElementById('t-'+nome).classList.add('ativo');
  if(nome==='minhas') carregarMinhas();
}

const btnGravar = document.getElementById('btnGravar');
const inputLink = document.getElementById('inputLink');
const inputNome = document.getElementById('inputNome');
const statusEl = document.getElementById('status');

btnGravar.addEventListener('click', async () => {
  let urlFinal = inputLink.value.trim();
  if(!urlFinal){ alert('Cole o link do Google!'); return; }
  if(!urlFinal.startsWith('http')) urlFinal = 'https://'+urlFinal;
  if(tipoAtual === 'url'){
    const id = Math.random().toString(36).substring(2,8);
    let mapas = JSON.parse(localStorage.getItem('mapas_rastreio')||'{}');
    mapas[id] = urlFinal;
    localStorage.setItem('mapas_rastreio', JSON.stringify(mapas));
    urlFinal = location.origin + location.pathname + '?r=' + id + '&dest=' + encodeURIComponent(urlFinal);
  }
  try{
    if(!('NDEFReader' in window)) throw new Error('Sem suporte a NFC - Use Chrome Android');
    statusEl.innerText = '⏳ Aproxime a tag NFC agora...';
    statusEl.style.color = '#ff6a00';
    const ndef = new NDEFReader();
    await ndef.write({ records: [{ recordType: "url", data: urlFinal }] });
    statusEl.innerText = '✅ GRAVADO COM SUCESSO!';
    statusEl.style.color = '#22c55e';
    let lista = JSON.parse(localStorage.getItem('tags_dion')||'[]');
    lista.unshift({nome: inputNome.value||'Tag sem nome', url: urlFinal, original: inputLink.value, data: new Date().toLocaleString(), cliques: 0});
    localStorage.setItem('tags_dion', JSON.stringify(lista));
    alert('Gravado!');
  }catch(e){
    alert('Erro: '+e.message);
    statusEl.innerText = '❌ '+e.message;
    statusEl.style.color = '#ef4444';
  }
});

// FUNÇÃO APAGAR - V4 COM MENSAGEM VISIVEL
async function apagarTag(){
  const status = document.getElementById('status');
  const btn = document.getElementById('btnApagar');
  
  // MOSTRA NA HORA
  status.innerText = '👉 CLICOU EM APAGAR - AGORA APROXIME A TAG E SEGURE 3s';
  status.style.color = '#ff6a00';
  status.style.background = '#331a00';
  btn.innerText = '⏳ AGUARDANDO TAG... APROXIME AGORA!';
  
  console.log('Função apagar chamada');
  
  if(!('NDEFReader' in window)){
    status.innerText = '❌ Sem suporte NFC - Use Chrome Android';
    return;
  }

  if(!confirm('Apagar LINK da tag? Ela vai ficar vazia.')){
    status.innerText = 'Cancelado';
    btn.innerText = '🗑️ APAGAR TAG - LIMPAR LINK';
    return;
  }

  try{
    const ndef = new NDEFReader();
    status.innerText = '🔥 APROXIME A TAG AGORA - NÃO TIRE POR 3 SEGUNDOS';
    
    // Grava vazio para apagar o link
    await ndef.write({ records: [] });
    
    status.innerText = '✅ TAG APAGADA! LINK REMOVIDO - TAG VAZIA';
    status.style.color = '#22c55e';
    status.style.background = '#002a00';
    btn.innerText = '🗑️ APAGAR TAG - LIMPAR LINK';
    alert('✅ TAG APAGADA COM SUCESSO!\nO link foi removido. Agora ela está vazia.');
    
  }catch(e){
    console.error(e);
    // tenta segundo método se o primeiro falhar
    if(e.message.includes('Failed') || e.name === 'NotSupportedError'){
      try{
        const ndef2 = new NDEFReader();
        await ndef2.write({ records: [{ recordType: "text", data: " " }] });
        status.innerText = '✅ TAG APAGADA! (método 2)';
        alert('✅ Apagada!');
        return;
      }catch(e2){}
    }
    status.innerText = '❌ Erro: ' + e.message;
    status.style.color = '#ef4444';
    btn.innerText = '🗑️ APAGAR TAG - LIMPAR LINK';
    alert('Erro ao apagar: ' + e.message + '\nDeixe a tag encostada sem tirar por 3s');
  }
}

function carregarMinhas(){
  let lista = JSON.parse(localStorage.getItem('tags_dion')||'[]');
  let html = lista.length? '': '<p style="color:#888">Nenhuma tag ainda</p>';
  lista.forEach((t,i)=>{
    html+=`<div style="border-bottom:1px solid #333;padding:8px 0"><b>${t.nome}</b><br><small>${t.data}</small><br><small style="color:#ff6a00;word-break:break-all">${t.url}</small></div>`;
  });
  document.getElementById('listaTags').innerHTML = html;
}
function gerarPixLink(){
  const chave = document.getElementById('pixChave').value;
  document.getElementById('inputLink').value = 'pix:'+chave;
  mudarAba('escrever');
  setTipo('pixid');
}
(function checkRedirect(){
  const params = new URLSearchParams(location.search);
  if(params.has('r')){
    const dest = params.get('dest');
    if(dest){
      setTimeout(()=>{ location.href = decodeURIComponent(dest); }, 800);
      document.body.innerHTML = '<h1 style="text-align:center;margin-top:50%">Redirecionando...</h1>';
    }
  }
})();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js', {scope: './'});
}
</script>
</body>
</html>
